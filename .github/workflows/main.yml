
name: Build Windows VST3 Debug

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Checkout JUCE
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          path: JUCE
          submodules: recursive

      - name: Show project files
        shell: pwsh
        run: |
          Write-Host "=== PROJECT FILES ==="
          Get-ChildItem -Force
          Get-ChildItem Source -Recurse -File

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S . -B build -A x64 --log-level=VERBOSE 2>&1 | Tee-Object configure.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build VST3
        shell: pwsh
        run: |
          cmake --build build --config Release --target VocalForge_VST3 --verbose 2>&1 | Tee-Object build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VocalForge-build-logs
          path: |
            configure.log
            build.log
          if-no-files-found: warn

      - name: Upload VST3
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VocalForge-Windows-VST3
          path: build/VocalForge_artefacts/Release/VST3/**
          if-no-files-found: error
